services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel
    ports:
      - "127.0.0.1:8888:3000"
    env_file:
      - ./backend/.env
    volumes:
      # Docker socket — for container management and event streaming
      - /var/run/docker.sock:/var/run/docker.sock

      # Host /proc — for CPU, memory, network, uptime, load metrics
      - /proc:/host/proc:ro

      # Host /sys — for CPU temperature (thermal zones)
      - /sys:/host/sys:ro

      # Host root filesystem — for accurate disk usage (df on host /)
      - /:/host/root:ro,rbind

      # Host /dev/disk — for future SSD SMART data
      - /dev/disk:/host/dev/disk:ro

      # Host utmp — for SSH session counting (supplemented by /proc/net/tcp)
      - /var/run/utmp:/host/var/run/utmp:ro

      # Caddy config — for website auto-discovery (Caddyfile parsing)
      - /etc/caddy:/host/caddy:ro

      # Caddy access logs — for req/min, status codes, response time analytics
      - /var/log/caddy:/host/var/log/caddy:ro

      # Git repositories — for deployment management (read-write for git pull)
      - /srv/apps:/srv/apps

      # SQLite recording database — persistent across restarts
      - sentinel-data:/app/data

    # Required for nsenter-based service control (systemctl via host namespace)
    privileged: true
    pid: host

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sentinel-data:
    driver: local
