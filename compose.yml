# ════════════════════════════════════════════════════════════════════
# LEGACY — pre-migration monolithic deployment.
#
# This file describes the single-container architecture Sentinel is
# being migrated away from (see ARCHITECTURE.md): one privileged container
# with `nsenter`-based systemctl access and a read-write Docker socket.
#
# As of the Phase 1 agent/server split, server/ no longer talks to
# Docker or systemctl directly — it calls a sentinel-agent process over
# a Unix socket that this compose file does not run. Building this
# image now produces a server that cannot reach any host tool until an
# agent is also running. It is kept only so the already-running
# production container can be rebuilt in an emergency during the
# migration window; it is not the target deployment. See Phase 2 for
# the native systemd installer that replaces it.
# ════════════════════════════════════════════════════════════════════
services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel
    ports:
      - "127.0.0.1:8888:3000"
    env_file:
      - ./server/.env
    volumes:
      # Docker socket — for container management and event streaming
      - /var/run/docker.sock:/var/run/docker.sock

      # Host /proc — for CPU, memory, network, uptime, load metrics
      - /proc:/host/proc:ro

      # Host /sys — for CPU temperature (thermal zones)
      - /sys:/host/sys:ro

      # Host root filesystem — for accurate disk usage (df on host /)
      - /:/host/root:ro,rbind

      # Host /dev/disk — for future SSD SMART data
      - /dev/disk:/host/dev/disk:ro

      # Host utmp — for SSH session counting (supplemented by /proc/net/tcp)
      - /var/run/utmp:/host/var/run/utmp:ro

      # Caddy config — for website auto-discovery (Caddyfile parsing)
      - /etc/caddy:/host/caddy:ro

      # Caddy access logs — for req/min, status codes, response time analytics
      - /var/log/caddy:/host/var/log/caddy:ro

      # Git repositories — for deployment management (read-write for git pull)
      - /srv/apps:/srv/apps

      # SQLite recording database — persistent across restarts
      - sentinel-data:/app/data

    # Required for nsenter-based service control (systemctl via host namespace)
    privileged: true
    pid: host

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sentinel-data:
    driver: local
